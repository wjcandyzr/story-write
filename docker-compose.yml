# 顶层 name 决定 Docker Desktop 中的折叠组(就是你截图里的 "docker"、"nature" 那个文件夹)。
name: novel

services:
  postgres:
    image: postgres:16-alpine
    container_name: novel-postgres
    environment:
      POSTGRES_DB: ai_novel
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel_pass
    ports:
      - "5452:5432"           # 宿主 5452 → 容器 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d ai_novel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: novel-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6399:6379"           # 宿主 6399 → 容器 6379
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: novel-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # 容器内部仍走 5432 / 6379(Docker 网络里是容器原生端口,不是宿主映射端口)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: novel
      DB_PASSWORD: novel_pass
      DB_NAME: ai_novel
      DB_SYNC: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      JWT_EXPIRES_IN: 7d
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.8}
      CHECKPOINT_PG_URL: postgres://novel:novel_pass@postgres:5432/ai_novel
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
