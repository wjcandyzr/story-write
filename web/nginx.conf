# ====================================================================
# AI Novel Platform - 前端 nginx 配置
# 单容器搞定:服 SPA + 反代后端 (REST + WebSocket + Swagger)
# ====================================================================

# 后端 nest 上游 (docker-compose 网络里的服务名)
upstream nest_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # gzip 压缩 SPA 静态资源(JS/CSS bundle 体积巨大,压一下省带宽)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ----- 静态前端 (Vue SPA) -----
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback:任何未命中的路径都返回 index.html,让 vue-router 接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 给 hashed 资源加长缓存(/assets/xxx-abc123.js 之类)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ----- REST API -----
    location /api/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 章节生成走非流式(LLM_FAKE_STREAM=true)单次可能超过 1 分钟,
        # nginx 默认 60s 超时太短,放到 5 分钟。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # ----- Swagger -----
    location /docs {
        proxy_pass http://nest_api;
        proxy_set_header Host $host;
    }

    # ----- WebSocket (Socket.IO) -----
    # 关键三件套:
    #   - http_version 1.1
    #   - Upgrade / Connection 头
    #   - 长 read_timeout (防止 idle 时长被切)
    location /socket.io/ {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 86400s;   # 24h,等价于 "不主动断连"
        proxy_send_timeout 86400s;
        proxy_buffering off;          # SSE / 流式必须关
    }

    # ----- 健康检查 -----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
